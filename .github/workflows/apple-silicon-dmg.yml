name: Apple Silicon DMG

on:
  push:
    branches: [stella]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the DMG
        run: scripts/ci/build-dmg.sh
      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: work/out/dist/Stella-*-arm64.dmg
          archive: false
          if-no-files-found: error
